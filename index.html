<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronald Lethcoe - Instructional Design & AI Integration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Color System - Sophisticated Educational Palette */
            --color-bg: #fafaf8;
            --color-surface: #ffffff;
            --color-surface-hover: #f5f5f3;
            --color-border: #e6e4df;
            --color-border-accent: #d4cfc4;
            
            /* Text Colors */
            --color-text-primary: #1a1a16;
            --color-text-secondary: #5a5751;
            --color-text-muted: #8a857c;
            
            /* Accent Colors - Professional Blue */
            --color-accent-primary: #002FA7;
            --color-accent-secondary: #0047D1;
            --color-accent-tertiary: #0039B8;
            
            /* Shadows & Effects */
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.06), 0 4px 6px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.08), 0 10px 10px rgba(0, 0, 0, 0.04);
            
            /* Typography */
            --font-display: 'Roboto', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            
            /* Spacing Scale */
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 1.5rem;
            --space-lg: 2.5rem;
            --space-xl: 4rem;
            
            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.3s ease;
        }

        /* Subtle background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 2px 2px, var(--color-border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-md);
            position: relative;
            z-index: 1;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: var(--space-xl);
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .profile-image-container {
            width: 120px;
            height: 120px;
            margin: 0 auto var(--space-md);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 4px solid var(--color-surface);
            position: relative;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .profile-image-container:hover {
            transform: scale(1.05);
        }

        .profile-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--color-text-primary);
            margin-bottom: var(--space-xs);
            letter-spacing: 0.02em;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .header .title-accent {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--color-accent-primary);
            font-weight: 600;
            margin-bottom: var(--space-sm);
            display: block;
        }

        .header .tagline {
            font-size: 1.125rem;
            color: var(--color-text-secondary);
            max-width: 500px;
            margin: 0 auto;
            font-weight: 400;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(
                to right, 
                transparent, 
                var(--color-border-accent), 
                transparent
            );
            margin: var(--space-lg) 0;
            opacity: 0;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        /* Links Grid */
        .links-grid {
            display: grid;
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
        }

        .link-card {
            opacity: 0;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .link-card:nth-child(1) { animation-delay: 0.1s; }
        .link-card:nth-child(2) { animation-delay: 0.15s; }
        .link-card:nth-child(3) { animation-delay: 0.2s; }
        .link-card:nth-child(4) { animation-delay: 0.25s; }
        .link-card:nth-child(5) { animation-delay: 0.3s; }

        .link-card a {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-md) var(--space-lg);
            background: var(--color-surface);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--color-text-primary);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .link-card a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                transparent 0%,
                rgba(0, 47, 167, 0.03) 50%,
                transparent 100%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-card a:hover::before {
            opacity: 1;
        }

        .link-card a:hover {
            transform: translateX(4px);
            border-color: var(--color-accent-primary);
            box-shadow: var(--shadow-md);
            background: var(--color-surface-hover);
        }

        .link-card a:active {
            transform: translateX(2px);
        }

        .link-icon-wrapper {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--color-accent-primary), var(--color-accent-tertiary));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .link-card a:hover .link-icon-wrapper {
            transform: scale(1.1) rotate(5deg);
        }

        .link-icon {
            width: 24px;
            height: 24px;
            stroke: white;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .link-content {
            flex: 1;
        }

        .link-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.125rem;
        }

        .link-description {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            font-weight: 400;
        }

        .link-arrow {
            width: 20px;
            height: 20px;
            stroke: var(--color-text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .link-card a:hover .link-arrow {
            stroke: var(--color-accent-primary);
            transform: translateX(4px);
        }

        /* Contact Section */
        .contact-section {
            background: var(--color-surface);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            box-shadow: var(--shadow-md);
            opacity: 0;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        .contact-section h2 {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: var(--space-xs);
            letter-spacing: -0.01em;
        }

        .contact-section p {
            color: var(--color-text-secondary);
            margin-bottom: var(--space-md);
            font-size: 1rem;
        }

        .contact-form {
            display: grid;
            gap: var(--space-md);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group textarea {
            padding: var(--space-sm) var(--space-md);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--color-text-primary);
            background: var(--color-bg);
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-accent-primary);
            background: var(--color-surface);
            box-shadow: 0 0 0 3px rgba(0, 47, 167, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-button {
            padding: var(--space-md) var(--space-lg);
            background: linear-gradient(135deg, var(--color-accent-primary), var(--color-accent-tertiary));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-sm);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .email-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            color: var(--color-accent-primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .email-link:hover {
            gap: var(--space-sm);
            color: var(--color-accent-tertiary);
        }

        .email-link svg {
            width: 20px;
            height: 20px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: var(--space-xl);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--color-border);
            opacity: 0;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        .footer p {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            letter-spacing: 0.03em;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .container {
                padding: var(--space-lg) var(--space-md);
            }

            .header h1 {
                font-size: 2.25rem;
            }

            .header .title-accent {
                font-size: 0.75rem;
            }

            .header .tagline {
                font-size: 0.9rem;
            }

            .link-card a {
                padding: var(--space-md);
                gap: var(--space-sm);
            }

            .link-icon-wrapper {
                width: 40px;
                height: 40px;
            }

            .link-icon {
                width: 20px;
                height: 20px;
            }

            .link-title {
                font-size: 1rem;
            }

            .link-description {
                font-size: 0.8125rem;
            }

            .contact-section {
                padding: var(--space-md);
            }

            .contact-section h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="profile-image-container">
                <img src="Ronald.png" alt="Ronald Lethcoe">
            </div>
            <span class="title-accent">Curriculum & Instructional Design Specialist</span>
